services:
  kafka:
    image: apache/kafka:3.8.0
    ports: ["29092:29092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 5s
      retries: 20

  topic-init:
    image: apache/kafka:3.8.0
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command: |
      for t in transactions.created \
               fraud.retry.5s fraud.retry.30s fraud.retry.5m fraud.dlq fraud.replay \
               fraud.flags; do
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 \
          --create --if-not-exists --topic $$t --partitions 6 --replication-factor 1
      done
      echo "Fraud pipeline topics created successfully."

  postgres:
    image: postgres:16
    ports: ["5432:5432"]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: fraud_db
    volumes:
      - ./migrations:/docker-entrypoint-initdb.d/migrations:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d fraud_db"]
      interval: 3s
      retries: 20

  redpanda-console:
    image: docker.redpanda.com/redpandadata/console:latest
    ports: ["8080:8080"]
    environment:
      KAFKA_BROKERS: kafka:9092
    depends_on:
      - kafka

  ml-scorer:
    build:
      context: .
      dockerfile: ml/Dockerfile
    ports: ["8000:8000"]
    environment:
      MODEL_PATH: /app/ml/model.joblib

  fraud-service:
    build:
      context: .
      args:
        SVC: fraud-service
    ports: ["8085:8085"]
    environment:
      DATABASE_URL: postgres://postgres:dev@postgres:5432/fraud_db?sslmode=disable
      KAFKA_BROKERS: kafka:9092
      RULES_CONFIG_PATH: /app/configs/rules.yaml
      ML_SCORER_URL: http://ml-scorer:8000
      ML_SHADOW_MODE: "false"
      PORT: "8085"
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
      topic-init:
        condition: service_completed_successfully
      ml-scorer:
        condition: service_started

  outbox-relay:
    build:
      context: .
      args:
        SVC: outbox-relay
    ports: ["8084:8084"]
    environment:
      DATABASE_URL: postgres://postgres:dev@postgres:5432/fraud_db?sslmode=disable
      KAFKA_BROKERS: kafka:9092
      POLL_INTERVAL_MS: "200"
      PORT: "8084"
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
      topic-init:
        condition: service_completed_successfully
